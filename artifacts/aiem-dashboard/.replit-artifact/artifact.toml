kind = "web"
previewPath = "/aiem/"
title = "AIEM Institutional Terminal"
version = "1.0.0"
id = "artifacts/aiem-dashboard"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/aiem/" ]
localPort = 26003

[services.development]
run = "pnpm --filter @workspace/aiem-dashboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/aiem-dashboard", "run", "build" ]
publicDir = "artifacts/aiem-dashboard/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26003"
BASE_PATH = "/aiem/"
