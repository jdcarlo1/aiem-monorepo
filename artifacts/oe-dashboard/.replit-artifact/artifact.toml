kind = "web"
previewPath = "/oe-dashboard/"
title = "Options Engine Terminal"
version = "1.0.0"
id = "artifacts/oe-dashboard"
router = "path"

[[services]]
name = "web"
paths = [ "/oe-dashboard/" ]
localPort = 24896

[services.development]
run = "pnpm --filter @workspace/oe-dashboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/oe-dashboard", "run", "build" ]
serve = "static"
publicDir = "artifacts/oe-dashboard/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24896"
BASE_PATH = "/oe-dashboard/"
