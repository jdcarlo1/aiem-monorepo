kind = "data-app"
previewPath = "/stock-scanner/"
title = "Stock Scanner"
version = "1.0.0"
id = "artifacts/stock-scanner"
router = "path"

[[integratedSkills]]
name = "data-visualization"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/stock-scanner/" ]
localPort = 21411

[services.development]
run = "pnpm --filter @workspace/stock-scanner run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/stock-scanner", "run", "build" ]
publicDir = "artifacts/stock-scanner/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21411"
BASE_PATH = "/stock-scanner/"

[[services]]
name = "stock-api"
paths = [ "/stock-api/" ]
localPort = 5050

[services.development]
run = "python /home/runner/workspace/artifacts/stock-scanner-api/main.py"

[services.env]
STOCK_API_PORT = "5050"
