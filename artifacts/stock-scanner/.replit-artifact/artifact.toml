kind = "data-app"
  previewPath = "/stock-scanner/"
  title = "Stock Scanner"
  version = "1.0.0"
  id = "artifacts/stock-scanner"
  router = "path"

  [[integratedSkills]]
  name = "data-visualization"
  version = "1.0.0"

  [[services]]
  name = "web"
  paths = [ "/stock-scanner/" ]
  localPort = 21411

  [services.development]
  run = "pnpm --filter @workspace/stock-scanner run dev"

  [services.production]
  build = [ "pnpm", "--filter", "@workspace/stock-scanner", "run", "build" ]
  publicDir = "artifacts/stock-scanner/dist/public"
  serve = "static"

  [[services.production.rewrites]]
  from = "/*"
  to = "/index.html"

  [services.env]
  PORT = "21411"
  BASE_PATH = "/stock-scanner/"

  [[services]]
  name = "stock-api"
  paths = [ "/stock-api/" ]
  localPort = 5050

  [services.development]
  run = "bash /home/runner/workspace/artifacts/stock-scanner-api/stock_api_wrapper.sh"

  [services.production]
  run = "bash /home/runner/workspace/artifacts/stock-scanner-api/stock_api_wrapper.sh"

  [services.production.health.startup]
  path = "/stock-api/health"

  [services.env]
  STOCK_API_PORT = "5050"

  [[services]]
  name = "aiem-telegram"
  paths = [ "/aiem-telegram/" ]
  localPort = 5052

  [services.development]
  run = "bash /home/runner/workspace/artifacts/stock-scanner-api/notifier_wrapper.sh"

  [services.production]
  run = "bash /home/runner/workspace/artifacts/stock-scanner-api/notifier_wrapper.sh"

  [services.production.health.startup]
  path = "/aiem-telegram/api/health"

  [services.env]
  AIEM_HEALTH_PORT = "5052"

  [[services]]
  name = "aiem-process"
  paths = [ "/aiem-process/" ]
  localPort = 5055

  [services.development]
  run = "bash /home/runner/workspace/artifacts/stock-scanner-api/aiem_process_wrapper.sh"

  [services.production]
  run = "bash /home/runner/workspace/artifacts/stock-scanner-api/aiem_process_wrapper.sh"

  [services.production.health.startup]
  path = "/aiem-process/"

  [services.env]
  AIEM_PROCESS_PORT = "5055"

  [[services]]
  name = "options-pipeline-scheduler"
  paths = [ "/options-pipeline/" ]
  localPort = 5053

  [services.development]
  run = "python3 /home/runner/workspace/artifacts/stock-scanner-api/aiem_options_scheduler.py"

  [services.production]
  run = "python3 /home/runner/workspace/artifacts/stock-scanner-api/aiem_options_scheduler.py"

  [services.production.health.startup]
  path = "/health"

  [services.env]
  OPTIONS_SCHEDULER_PORT = "5053"

  [[services]]
  name = "ase-strat-scheduler"
  paths = [ "/ase-strat/" ]
  localPort = 5054

  [services.development]
  run = "python3 /home/runner/workspace/artifacts/stock-scanner-api/aiem_strat_scheduler.py"

  [services.production]
  run = "python3 /home/runner/workspace/artifacts/stock-scanner-api/aiem_strat_scheduler.py"

  [services.production.health.startup]
  path = "/health"

  [services.env]
  STRAT_SCHEDULER_PORT = "5054"

  [[services]]
  name = "probability-engine-scheduler"
  paths = [ "/prob-engine/" ]
  localPort = 5056

  [services.development]
  run = "cd /home/runner/workspace/artifacts/stock-scanner-api/aiem_probability_engine && python3 daily_scheduler.py"

  [services.production]
  run = "cd /home/runner/workspace/artifacts/stock-scanner-api/aiem_probability_engine && python3 daily_scheduler.py"

  [services.production.health.startup]
  path = "/health"

  [services.env]
  PROB_ENGINE_PORT = "5056"
