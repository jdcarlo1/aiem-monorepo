kind = "web"
previewPath = "/"
title = "NCLEX Prep"
version = "1.0.0"
id = "artifacts/nclex-prep"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24069

[services.development]
run = "pnpm --filter @workspace/nclex-prep run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nclex-prep", "run", "build" ]
publicDir = "artifacts/nclex-prep/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24069"
BASE_PATH = "/"
