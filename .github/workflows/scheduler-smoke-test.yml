name: Scheduler Smoke Test

# Runs on every push that touches the scheduler files or this workflow.
# Proves that:
#   1. Both files parse (syntax)
#   2. All LATE_REF targets in main.py have _wait_for_module_load() guards
#   3. No raw scheduler lambdas reference late-def targets
#   4. All OE add_job targets are defined before sched.start()
#   5. Core candidate-generation functions exist in both files (AST)
#   6. All LATE_REF targets still exist as named functions in main.py (AST)
#   7. All OE_MODULE_TARGETS still exist as named functions in
#      aiem_options_scheduler.py (AST)
#   8+9. Per-system forced-failure proofs (SMOKE_FULL=1)
# No DB or external service needed — pure stdlib.

on:
  push:
    paths:
      - 'artifacts/stock-scanner-api/main.py'
      - 'artifacts/stock-scanner-api/aiem_options_scheduler.py'
      - 'tools/scheduler_smoke_test.py'
      - '.github/workflows/scheduler-smoke-test.yml'

concurrency:
  group: scheduler-smoke-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Run scheduler smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run smoke test (SMOKE_FULL=1)
        id: smoke
        run: |
          echo "=== SCHEDULER SMOKE TEST ==="
          echo "Commit : ${{ github.sha }}"
          echo "Branch : ${{ github.ref_name }}"
          echo "Run    : ${{ github.run_id }}"
          echo ""
          SMOKE_FULL=1 python3 tools/scheduler_smoke_test.py

      - name: Telegram alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TEXT="🚨 SCHEDULER SMOKE TEST FAILED%0ABranch: ${{ github.ref_name }}%0ACommit: ${{ github.sha }}%0ARun: ${RUN_URL}"
          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}&text=${TEXT}" \
            --max-time 10
          echo "Telegram alert sent."
