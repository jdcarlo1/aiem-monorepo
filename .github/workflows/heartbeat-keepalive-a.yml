name: Heartbeat Keepalive A

# ─────────────────────────────────────────────────────────────────────────────
# TIER 2 — Split dual-workflow keepalive (fixes cron-silence root cause).
#
# Problem: GitHub silently stops firing a workflow's scheduled cron when it has
# no recent push-triggered runs, even with state=active at the API level.
# Affected workflows: aiem-process-heartbeat, premarket-backup,
#                     market-hours-watchdog (all 0 schedule runs as of 2026-07-28).
#
# Fix: this workflow fires on EVERY PUSH to the repo (keeping itself alive) and
# on a daily schedule (backup).  On each run it dispatches:
#   - heartbeat-keepalive-b.yml  (its mutual partner — B dispatches A back)
#   - aiem-process-heartbeat.yml (ensures it accumulates workflow_dispatch runs)
#   - premarket-backup.yml       (same fix)
#   - market-hours-watchdog.yml  (same fix)
#
# B dispatches A back, so even if pushes stop the pair keeps each other alive
# indefinitely via workflow_dispatch runs.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  schedule:
    # Daily at 10:30 UTC (6:30 AM ET) — fires before the 10:45 heartbeat window
    - cron: '30 10 * * *'
    # Daily at 22:00 UTC (6:00 PM ET) — evening coverage
    - cron: '0 22 * * *'
  workflow_dispatch: {}

concurrency:
  group: heartbeat-keepalive-a
  cancel-in-progress: true

jobs:
  keepalive:
    name: Dispatch dependent workflows
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Dispatch heartbeat-keepalive-b, aiem-process-heartbeat, premarket-backup, market-hours-watchdog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO:     ${{ github.repository }}
        run: |
          echo "=== Heartbeat Keepalive A ==="
          echo "Trigger : ${{ github.event_name }}"
          echo "UTC     : $(date -u '+%Y-%m-%dT%H:%M:%S UTC')"
          echo "Run     : ${{ github.run_id }}"

          dispatch() {
            local WF="$1"
            HTTP=$(curl -s -o /tmp/dispatch_${WF}.json -w "%{http_code}" \
              -X POST \
              -H "Authorization: token ${GH_TOKEN}" \
              -H "Content-Type: application/json" \
              -d '{"ref":"main"}' \
              "https://api.github.com/repos/${REPO}/actions/workflows/${WF}/dispatches")
            echo "dispatch ${WF} → HTTP ${HTTP}"
          }

          dispatch "heartbeat-keepalive-b.yml"
          dispatch "aiem-process-heartbeat.yml"
          dispatch "premarket-backup.yml"
          dispatch "market-hours-watchdog.yml"

          echo "Done — all dispatches sent"
