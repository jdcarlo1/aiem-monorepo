name: AIEM Dead-Man's Switch

# ─────────────────────────────────────────────────────────────────────────────
# TIER 1 — Independent process-level dead-man's switch.
#
# Monitors the aiem_process_heartbeat DB table via /stock-api/admin/heartbeat-age.
# This is distinct from the HTTP liveness probe (aiem-process-heartbeat.yml):
#   - Liveness probe: checks whether the HTTP endpoint responds.
#   - Dead-man's switch: checks whether the *heartbeat writer* background thread
#     inside aiem-process is still alive, independent of HTTP serving.
#
# Alert thresholds:
#   age < 600s  -> OK (no action)
#   600-1800s   -> WARNING Telegram
#   > 1800s     -> DEAD Telegram (process likely OOM-killed or crashed)
#
# Fires every 30 min Mon-Fri during extended hours (6:00 AM - 7:00 PM ET).
# Has path-limited on:push so its own cron stays active without firing on
# every unrelated commit.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aiem-deadmans-switch.yml'
  # schedule disabled — free-tier Actions quota (see PR)
  # Free GitHub private: 2k min/mo; these crons starved PR checks
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true = check only, no Telegram alert'
        required: false
        default: 'false'

concurrency:
  group: aiem-deadmans-switch
  cancel-in-progress: true

jobs:
  deadmans-check:
    name: Check aiem_process heartbeat age
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Query heartbeat-age endpoint and alert if stale
        env:
          REPLIT_APP_URL:     ${{ secrets.REPLIT_APP_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN:            ${{ github.event.inputs.dry_run || 'false' }}
          RUN_URL:            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          echo "=== AIEM Dead-Man's Switch ==="
          echo "UTC    : $(date -u '+%Y-%m-%dT%H:%M:%S UTC')"
          echo "Trigger: ${{ github.event_name }}"
          echo "Run    : ${{ github.run_id }}"
          echo "Dry    : ${DRY_RUN}"

          # Push trigger fires only when this file changes — keepalive only, skip probe
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "Push trigger — keepalive run, skipping probe"
            exit 0
          fi

          # ── Query heartbeat-age endpoint ──────────────────────────────────
          URL="${REPLIT_APP_URL}/stock-api/admin/heartbeat-age"
          echo "Probing: ${URL}"
          HTTP=$(curl -s -o /tmp/hb_age.json -w "%{http_code}" \
            "${URL}" --max-time 12 2>&1) || HTTP="000"
          BODY=$(cat /tmp/hb_age.json 2>/dev/null || echo '{}')
          echo "HTTP ${HTTP}: ${BODY}"

          if [ "${HTTP}" != "200" ]; then
            STATUS="ENDPOINT_DOWN"
            AGE="unknown"
            PID="?"
            LAST_TS="unknown"
          else
            STATUS=$(echo "${BODY}" | python3 -c \
              "import sys,json; d=json.load(sys.stdin); print(d.get('status','UNKNOWN'))" \
              2>/dev/null || echo "PARSE_ERROR")
            AGE=$(echo "${BODY}" | python3 -c \
              "import sys,json; d=json.load(sys.stdin); print(d.get('age_seconds','?'))" \
              2>/dev/null || echo "?")
            LAST_TS=$(echo "${BODY}" | python3 -c \
              "import sys,json; d=json.load(sys.stdin); print(d.get('last_ts','?'))" \
              2>/dev/null || echo "?")
            PID=$(echo "${BODY}" | python3 -c \
              "import sys,json; d=json.load(sys.stdin); print(d.get('pid','?'))" \
              2>/dev/null || echo "?")
          fi

          echo "status=${STATUS}  age=${AGE}s  pid=${PID}"

          if [ "${STATUS}" = "OK" ]; then
            echo "Heartbeat current -- no alert"
            exit 0
          fi

          # ── STALE / DEAD / ENDPOINT_DOWN -- fire Telegram ────────────────
          NOW_UTC=$(date -u '+%Y-%m-%dT%H:%M UTC')

          echo "${STATUS}: heartbeat age=${AGE}s"

          if [ "${DRY_RUN}" = "true" ]; then
            echo "DRY RUN -- alert suppressed"
            exit 0
          fi

          TEXT="GH-DEADMANS%3A+aiem-process+heartbeat+${STATUS}%0Aage%3D${AGE}s+pid%3D${PID}%0Alast_ts%3D${LAST_TS}%0AUTC%3A+${NOW_UTC}%0ARun%3A+${RUN_URL}%0AAction%3A+check+Replit+%3E+aiem-process+workflow"

          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}&text=${TEXT}" \
            --max-time 10
          echo ""
          echo "Telegram alert sent"
          exit 1
