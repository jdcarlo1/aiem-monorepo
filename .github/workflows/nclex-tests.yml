name: NCLEX API — Critical-Path Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Run critical-path test suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        run: pnpm --filter @workspace/api-server test:coverage
        env:
          NODE_ENV: test

      - name: Enforce 100% coverage on all critical-path files
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const cov = JSON.parse(
            fs.readFileSync('artifacts/api-server/coverage/coverage-final.json', 'utf8')
          );

          // Critical-path files — every reachable branch must be tested.
          // Grouped by layer so failure messages are easy to triage:
          //   Payment layer  : stripe.ts, webhookHandlers.ts
          //   Auth layer     : sessionAuth.ts, session.ts
          //   Exam layer     : questions.ts, checkAnswer.ts
          const TARGETS = [
            { match: f => f.includes('/src/routes/stripe.ts'),         label: 'stripe.ts          (payment routes)' },
            { match: f => f.includes('/src/webhookHandlers.ts'),        label: 'webhookHandlers.ts (Stripe webhooks)' },
            { match: f => f.includes('/src/lib/sessionAuth.ts'),        label: 'sessionAuth.ts     (IDOR guard)' },
            { match: f => f.includes('/src/routes/session.ts'),         label: 'session.ts         (auth + exam workflow)' },
            { match: f => f.includes('/src/routes/questions.ts'),       label: 'questions.ts       (question delivery + answer reveal)' },
            { match: f => f.includes('/src/lib/checkAnswer.ts'),        label: 'checkAnswer.ts     (answer scoring)' },
          ];
          const THRESHOLD = 100;
          let anyFail = false;

          for (const { match, label } of TARGETS) {
            const key = Object.keys(cov).find(match);
            if (!key) {
              console.error('ERROR: ' + label + ' not found in coverage JSON');
              anyFail = true;
              continue;
            }
            const v = cov[key];
            const pct = (vals) => vals.length ? 100 * vals.filter(x => x > 0).length / vals.length : 100;
            const stmts    = pct(Object.values(v.s));
            const branches = pct(Object.values(v.b).flat());
            const fns      = pct(Object.values(v.f));
            const ok = stmts >= THRESHOLD && branches >= THRESHOLD && fns >= THRESHOLD;
            console.log((ok ? '✓' : '✗') + ' ' + label +
              ': stmts=' + stmts.toFixed(1) + '%' +
              ' branches=' + branches.toFixed(1) + '%' +
              ' fns=' + fns.toFixed(1) + '%');
            if (!ok) anyFail = true;
          }

          if (anyFail) {
            console.error(
              '\nCoverage threshold FAILED.\n' +
              'Required: 100% stmts/branches/fns on all 6 critical-path files.\n' +
              'A test was deleted, a branch was left uncovered, or a new code path was added without tests.'
            );
            process.exit(1);
          }
          console.log('\nAll coverage thresholds passed (' + TARGETS.length + '/6 files at 100%).');
          EOF

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: artifacts/api-server/coverage/
          retention-days: 30
