name: Deploy-on-Merge Reminder

# ─────────────────────────────────────────────────────────────────────────────
# What this does
# ─────────────────────────────────────────────────────────────────────────────
# Fires when origin/dev moves (live Replit branch). Normally that is the
# auto-sync from main (workflow sync-main-to-dev.yml) after a merge to main.
# Sends Telegram: pull origin/dev in the Replit workspace, then Publish.
#
# IMPORTANT — what this cannot do
# ─────────────────────────────────────────────────────────────────────────────
# Replit does NOT expose a public API for triggering a programmatic republish.
# The Admin API (api.replit.com/v1) is read-only for deployments. External
# Access Tokens are for bypassing access controls on private apps, not for
# initiating deploys. This was verified against Replit's own documentation on
# 2026-08-04. The only way to republish is to click Publish in the editor.
# Publish also does NOT git-fetch — pull the workspace to origin/dev first.
# This workflow automates the notification; pull + Publish remain manual.
#
# Secrets required (all already in repo secrets from other workflows):
#   TELEGRAM_BOT_TOKEN  — bot token
#   TELEGRAM_CHAT_ID    — owner chat ID
#
# Triggers on:
#   push to dev   — live branch updated (auto-sync or direct merge into dev)
#   workflow_dispatch — manual trigger for testing, with a dry_run option.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true = log only, no Telegram message'
        required: false
        default: 'false'

concurrency:
  group: deploy-on-merge
  cancel-in-progress: true

jobs:
  notify-deploy:
    name: Notify — republish needed after merge
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout (shallow — commit metadata only)
        uses: actions/checkout@v4
        with:
          fetch-depth: 2        # current commit + parent (for merge detection)

      - name: Send Telegram deploy reminder
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN:            ${{ github.event.inputs.dry_run || 'false' }}
          RUN_URL:            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA:         ${{ github.sha }}
          COMMIT_MSG:         ${{ github.event.head_commit.message }}
          PUSHER:             ${{ github.event.pusher.name || github.actor }}
        run: |
          echo "=== Deploy-on-Merge Reminder ==="
          echo "UTC    : $(date -u '+%Y-%m-%dT%H:%M:%S UTC')"
          echo "Trigger: ${{ github.event_name }}"
          echo "Commit : ${COMMIT_SHA}"
          echo "Message: ${COMMIT_MSG}"
          echo "Pusher : ${PUSHER}"
          echo "Dry run: ${DRY_RUN}"
          echo ""

          # ── Build the editor URL ──────────────────────────────────────────
          # replit.com/@<owner>/<slug> is the stable editor URL.
          REPLIT_EDITOR_URL="https://replit.com/@joeldcarlo/workspace"

          # ── Short commit SHA (7 chars) ────────────────────────────────────
          SHORT_SHA="${COMMIT_SHA:0:7}"

          # ── First line of commit message (strip newlines, truncate) ───────
          FIRST_LINE=$(echo "${COMMIT_MSG}" | head -1 | cut -c1-80)

          echo "Short SHA : ${SHORT_SHA}"
          echo "First line: ${FIRST_LINE}"

          if [ "${DRY_RUN}" = "true" ]; then
            echo "DRY RUN — Telegram message suppressed"
            echo "Would have sent: DEPLOY READY | ${SHORT_SHA} | ${FIRST_LINE}"
            exit 0
          fi

          # ── URL-encode the message components ────────────────────────────
          # Telegram Bot API accepts plain text with %0A for newlines.
          # Percent-encode spaces as + and & as %26 to survive -d passing.
          SAFE_LINE=$(python3 -c \
            "import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=''))" \
            "${FIRST_LINE}" 2>/dev/null || echo "${FIRST_LINE}")
          SAFE_URL=$(python3 -c \
            "import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=':/?=@'))" \
            "${REPLIT_EDITOR_URL}" 2>/dev/null || echo "${REPLIT_EDITOR_URL}")
          SAFE_RUN=$(python3 -c \
            "import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=':/?=@#'))" \
            "${RUN_URL}" 2>/dev/null || echo "${RUN_URL}")

          # ── Morning blackout guard (next-best; Replit cannot block Publish) ─
          # Replit has no public API to refuse Publish. If merge lands inside
          # Mon–Fri 08:50–10:20 ET, do NOT say "Publish now" — warn hard.
          # Override only with ALLOW_MORNING_PUBLISH=1.
          BLACKOUT_MODE=$(python3 - <<'PY'
import sys
sys.path.insert(0, "artifacts/stock-scanner-api")
from morning_deploy_blackout import deploy_reminder_mode, et_now
print(deploy_reminder_mode(et_now()))
PY
)
          echo "Blackout mode: ${BLACKOUT_MODE}"
          if [ "${BLACKOUT_MODE}" = "blackout" ] && [ "${ALLOW_MORNING_PUBLISH:-}" != "1" ]; then
            TEXT="⛔+MORNING+BLACKOUT+—+DO+NOT+PUBLISH%0A%0ACommit%3A+${SHORT_SHA}+on+dev%0A${SAFE_LINE}%0A%0Aorigin%2Fdev+updated+by+${PUSHER}+during+08%3A50–10%3A20+ET.%0A%0A1)+In+Replit%3A+git+pull+--ff-only+origin+dev%0A2)+Do+NOT+Publish+until+after+10%3A30+ET+%28or+before+08%3A45+ET%29.%0AMid-window+Publish+missed+Loop+B+%2B+paper+9%3A42+on+2026-08-07.%0A%0AEditor%3A+${SAFE_URL}%0AGH+run%3A+${SAFE_RUN}"
          else
            TEXT="🚀+DEV+READY+—+PULL+%2B+PUBLISH%0A%0ACommit%3A+${SHORT_SHA}+on+dev%0A${SAFE_LINE}%0A%0A✅+origin%2Fdev+updated+by+${PUSHER}%0A%0A1)+Replit+Shell%3A+git+pull+--ff-only+origin+dev%0A2)+Publish%3A+${SAFE_URL}%0A%0APublish+alone+does+NOT+fetch+GitHub.%0AGH+run%3A+${SAFE_RUN}"
          fi

          # ── Send Telegram message ─────────────────────────────────────────
          HTTP=$(curl -s -o /tmp/tg_resp.json -w "%{http_code}" \
            -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}&text=${TEXT}" \
            --max-time 10 2>&1) || HTTP="000"

          RESP=$(cat /tmp/tg_resp.json 2>/dev/null || echo '{}')
          echo "Telegram HTTP ${HTTP}: ${RESP}"

          if [ "${HTTP}" = "200" ]; then
            echo "✓ Deploy reminder sent to Telegram"
          else
            echo "✗ Telegram send failed (HTTP ${HTTP}) — non-fatal, notification only"
            # Exit 0: a failed notification is not a deployment failure.
            # The merge already happened; crashing CI here would be misleading.
          fi

          exit 0
