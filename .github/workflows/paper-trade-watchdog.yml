name: Paper Trade Daily Watchdog

# External backup trigger for paper trades — fires at 9:45 AM and 10:30 AM ET Mon-Fri.
# If the in-process scheduler (9:42 AM cron) fires correctly, these calls are
# deduplicated in under 2 seconds (ledger check returns "already claimed").
# If the scheduler missed (VM restart, crash, cold boot), these calls trigger
# the real execution so no trading day is ever blank.
#
# Root cause this fixes:
#   July 25 2026 — server was down at 9:42 AM ET, no in-process catchup ran,
#   and no external watchdog existed for paper trades specifically.
#
# This workflow NEVER bypasses dedup — the existing ledger/lock in
# _aiem_paper_execute_today() still prevents double execution.

on:
  # schedule disabled — free-tier Actions quota (see PR)
  # Free GitHub private: 2k min/mo; these crons starved PR checks

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true = check only, do not trigger'
        required: false
        default: 'false'

concurrency:
  group: paper-trade-watchdog
  cancel-in-progress: false

jobs:
  ensure-paper-trades:
    name: Ensure Paper Trades Run Today
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger paper trade execution if not yet run today
        env:
          REPLIT_APP_URL: ${{ secrets.REPLIT_APP_URL }}
          ADMIN_TOKEN:    ${{ secrets.ADMIN_TOKEN }}
          DRY_RUN:        ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          echo "=== Paper Trade Daily Watchdog ==="
          echo "UTC time : $(date -u '+%Y-%m-%dT%H:%M:%S UTC')"
          echo "Run ID   : ${{ github.run_id }}"
          echo "Dry run  : ${DRY_RUN}"
          echo "======================================"

          # ── Window guard: only act 9:40 AM - 11:30 AM ET (13:40-15:30 UTC) ──
          HOUR_UTC=$(date -u +%H)
          MIN_UTC=$(date -u +%M)
          TIME_UTC=$(( HOUR_UTC * 60 + MIN_UTC ))
          WINDOW_START=$(( 13 * 60 + 40 ))   # 9:40 AM ET
          WINDOW_END=$(( 15 * 60 + 30 ))     # 11:30 AM ET

          if [ "${TIME_UTC}" -lt "${WINDOW_START}" ] || [ "${TIME_UTC}" -gt "${WINDOW_END}" ]; then
            echo "Outside paper-trade window (${HOUR_UTC}:${MIN_UTC} UTC) — no action"
            exit 0
          fi

          if [ "${DRY_RUN}" = "true" ]; then
            echo "DRY RUN — would trigger paper trades, skipping actual call"
            exit 0
          fi

          # ── Trigger paper trade run (idempotent — deduped server-side) ───────
          echo "Triggering paper trade run..."
          HTTP_CODE=$(curl -s -o /tmp/pt_body.json -w "%{http_code}" \
            -X POST "${REPLIT_APP_URL}/stock-api/admin/run-paper-today" \
            -H "X-Admin-Token: ${ADMIN_TOKEN}" \
            -H "Content-Type: application/json" \
            --max-time 20 2>&1) || HTTP_CODE="000"

          BODY=$(cat /tmp/pt_body.json 2>/dev/null || echo '{}')
          echo "HTTP ${HTTP_CODE}: ${BODY}"

          if [ "${HTTP_CODE}" = "200" ] || [ "${HTTP_CODE}" = "201" ]; then
            STATUS=$(echo "${BODY}" | python3 -c \
              "import sys,json; d=json.load(sys.stdin); print(d.get('status','?'))" \
              2>/dev/null || echo "?")
            echo "✅ Paper trade endpoint responded — status=${STATUS}"
            exit 0
          elif [ "${HTTP_CODE}" = "401" ]; then
            echo "ERROR: Admin token rejected — check ADMIN_TOKEN secret"
            exit 1
          elif [ "${HTTP_CODE}" = "503" ]; then
            echo "WARNING: Server still initializing — will retry at next scheduled slot"
            exit 0
          else
            echo "WARNING: Unexpected HTTP ${HTTP_CODE} — server may be restarting"
            exit 0
          fi
